# SonarQube Scanner Configuration
# Project: Symfony Demo Application

sonar.projectKey=COG-GTM_-symfony-rest-sample-v7.0
sonar.projectName=Symfony REST Sample v7.0
sonar.sourceEncoding=UTF-8

# Sources and Tests
sonar.sources=src
sonar.tests=tests

# Exclusions - generated code, vendor, build artifacts
sonar.exclusions=**/vendor/**,**/var/**,**/node_modules/**,**/public/build/**,**/assets/**/*.min.js

# Test exclusions
sonar.test.exclusions=**/tests/**

# PHP Coverage (Clover XML format)
sonar.php.coverage.reportPaths=coverage/clover.xml

# PHP Test Execution Report (JUnit format)
sonar.php.tests.reportPath=coverage/junit.xml

# Language-specific settings
sonar.language=php

# Pull Request decoration (CI usually sets these automatically)
# sonar.pullrequest.key=
# sonar.pullrequest.branch=
# sonar.pullrequest.base=
