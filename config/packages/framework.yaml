# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    # ESI and the /_fragment route are disabled because no ESI-capable reverse proxy
    # sits in front of this app; render(controller()) and render_esi() fall back to
    # inline sub-requests, which don't need them. Only re-enable them behind such a
    # proxy and with a unique, non-committed APP_SECRET, because /_fragment executes
    # any controller in a request signed with that secret.
    # https://symfony.com/doc/current/http_cache/esi.html
    esi: false
    fragments: false

    php_errors:
        log: true

    # The 'ide' option turns all of the file paths in an exception page
    # into clickable links that open the given file using your favorite IDE.
    # When 'ide' is set to null the file is opened in your web browser.
    # See https://symfony.com/doc/current/reference/configuration/framework.html#ide
    ide: null

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
