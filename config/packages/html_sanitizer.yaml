framework:
    html_sanitizer:
        default_sanitizer: 'default'
        sanitizers:
            default:
                # Read https://symfony.com/doc/current/html_sanitizer.html#configuration
                # to learn more about which extensions you would like to enable.
                extensions:
                    - 'basic'
                    - 'list'
                    - 'table'
                    - 'image'
                    - 'code'
                    # - 'iframe'
                    # - 'details'
                    # - 'extra'

                # Read https://symfony.com/doc/current/html_sanitizer.html#configuration
                # to discover all the available options for each extension.
